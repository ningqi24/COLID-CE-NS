name: Manual Sync to Community Edition

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to target repo
        uses: step-security/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.GH_PAT }}
          SKIP_PR: true                # 直接提交
          COMMIT_PREFIX: "[Auto Sync] "
          COMMIT_BODY: "Sync from COLID-CE-NS (main)"
          # CONFIG_PATH 默认 .github/sync.yml
