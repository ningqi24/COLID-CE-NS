# .github/sync.yml
SWEEP-office/COLID-OS--Community-Edition:   # 目标仓库全称
  - source: ./                              # 源路径（当前仓库根目录）
    dest: NS/                               # 目标文件夹（相对于目标仓库根目录）
    exclude:                                # 排除这些文件夹
      - .github/
      - .git/
    delete_orphaned: true                   # 删除目标中源没有的文件
